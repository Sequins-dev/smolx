# XcodeGen spec for mlx-serve.
#
# Use this when you need to build with Metal shader compilation (i.e. anything
# that exercises MLX at runtime — loading models, running inference). The
# SwiftPM CLI build (`swift build`) can't invoke `xcrun metal`, so it produces
# a binary that crashes with "Failed to load the default metallib" the moment
# MLX tries to spin up its GPU backend. xcodebuild knows how to drive the
# Metal toolchain and produces a working binary.
#
# Workflow:
#   brew install xcodegen          # one-time install
#   make xcode                     # regenerate mlx-serve.xcodeproj
#   make xcode-build               # build via xcodebuild (release config)
#   open mlx-serve.xcodeproj       # or work in Xcode normally
#
# Package.swift is the source of truth for everyday `swift build` and `make
# test`. project.yml duplicates the dependency list because XcodeGen can't
# parse Package.swift directly; keep them in sync when bumping versions.

name: mlx-serve

options:
  bundleIdPrefix: dev.mlxserve
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # MLX needs C++20 and the metal toolchain. xcodebuild picks these up
    # transitively from the mlx-swift package, but pinning them at the
    # project level avoids surprises in custom build configurations.
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    OTHER_LDFLAGS:
      - "-framework"
      - "Metal"
      - "-framework"
      - "Accelerate"

packages:
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser.git
    from: "1.2.0"
  SwiftLog:
    url: https://github.com/apple/swift-log.git
    from: "1.5.0"
  Hummingbird:
    url: https://github.com/hummingbird-project/hummingbird.git
    from: "2.23.0"
  MLX:
    url: https://github.com/ml-explore/mlx-swift.git
    minorVersion: "0.31.3"
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    majorVersion: "3.31.3"
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface.git
    from: "0.9.0"
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: "1.3.0"

targets:
  mlx-serve:
    type: tool
    platform: macOS
    sources:
      - path: Sources/mlx-serve
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: ArgumentParser
        product: ArgumentParser
      - package: SwiftLog
        product: Logging
      - package: Hummingbird
        product: Hummingbird
      - package: MLX
        product: MLX
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXVLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        # Tool targets default to no signing; that's what we want for a
        # local CLI binary.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: "NO"

schemes:
  mlx-serve:
    build:
      targets:
        mlx-serve: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
