name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build + publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          xcrun --find metal

      - name: Build (Release, with Metal shaders)
        run: make xcode-build

      - name: Stage release artifacts
        id: stage
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PRODUCTS="$PWD/build/Build/Products/Release"
          STAGE="$PWD/dist/smolx-${VERSION}-macos-arm64"
          mkdir -p "$STAGE"
          cp     "$PRODUCTS/smolx"                 "$STAGE/smolx"
          cp -R  "$PRODUCTS/mlx-swift_Cmlx.bundle" "$STAGE/mlx-swift_Cmlx.bundle"
          # Re-sign ad-hoc after the cp — the cp attaches a com.apple.provenance
          # xattr that flips the kernel's execution-policy decision and SIGKILLs
          # the binary silently on launch from the moved path. Re-signing makes
          # the kernel re-evaluate it as locally trusted.
          codesign --force --sign - "$STAGE/smolx"
          ( cd "$PWD/dist" && tar -czf "smolx-${VERSION}-macos-arm64.tar.gz" "smolx-${VERSION}-macos-arm64" )
          shasum -a 256 "$PWD/dist/smolx-${VERSION}-macos-arm64.tar.gz" > "$PWD/dist/smolx-${VERSION}-macos-arm64.tar.gz.sha256"
          echo "tarball=$PWD/dist/smolx-${VERSION}-macos-arm64.tar.gz"        >> "$GITHUB_OUTPUT"
          echo "sha=$PWD/dist/smolx-${VERSION}-macos-arm64.tar.gz.sha256"     >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.stage.outputs.tarball }}
            ${{ steps.stage.outputs.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
